<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetCare Market | Nutrición y Bienestar Animal</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <div>
      <h1>🐾 PetCare Market</h1>
      <p class="slogan">Especialistas en alimentos y accesorios</p>
    </div>
    <div class="user-controls">
      <span id="usuario-info" style="font-size: 0.9rem; font-weight: 500;"></span>
      <button id="btn-login" onclick="abrirModalLogin()" style="width: auto; padding: 8px 16px;">Ingresar</button>
      <button id="btn-carrito" onclick="toggleCarrito()" style="width: auto; padding: 8px 16px;">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <!-- Buscador Opcional -->
    <input id="buscador" class="buscador" type="search" placeholder="Buscar productos por nombre..." oninput="buscar(this.value)">

    <!-- Categorías -->
    <div id="categorias-container" class="categorias-container"></div>

    <!-- Catálogo de Productos -->
    <div id="productos-grid" class="productos-grid">
      <p>Cargando productos...</p>
    </div>
  </main>

  <!-- Modal de Login / Registro -->
  <div id="modal-auth" class="modal">
    <div class="modal-content">
      <h2 id="modal-titulo" style="margin-top: 0; color: var(--color-primario);">Iniciar Sesión</h2>
      
      <!-- Formulario de Login -->
      <form id="form-login" onsubmit="iniciarSesion(event)">
        <label>Email:</label>
        <input type="email" id="login-email" required>
        <label>Contraseña:</label>
        <input type="password" id="login-password" required>
        <button type="submit">Ingresar</button>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
          ¿No tenés cuenta? <a href="#" onclick="cambiarModoAuth(true); return false;" style="color: var(--color-primario);">Registrate</a>
        </p>
      </form>

      <!-- Formulario de Registro -->
      <form id="form-registro" onsubmit="registrar(event)" style="display: none;">
        <label>Nombre:</label>
        <input type="text" id="reg-nombre" required>
        <label>Email:</label>
        <input type="email" id="reg-email" required>
        <label>Contraseña (mínimo 6 caracteres):</label>
        <input type="password" id="reg-password" required minlength="6">
        <button type="submit">Crear Cuenta</button>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
          ¿Ya tenés cuenta? <a href="#" onclick="cambiarModoAuth(false); return false;" style="color: var(--color-primario);">Ingresar</a>
        </p>
      </form>

      <button onclick="cerrarModal()" style="background-color: #6b7280; margin-top: 0.5rem;">Cerrar</button>
    </div>
  </div>

  <!-- Modal del Carrito -->
  <div id="modal-carrito" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <h2 style="margin-top: 0; color: var(--color-primario);">🛒 Tu Carrito</h2>
      <div id="carrito-items" style="max-height: 300px; overflow-y: auto; margin-bottom: 1rem;"></div>
      <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; display: flex; justify-content: space-between;">
        <span>Total estimado:</span>
        <span id="carrito-total">$0</span>
      </div>
      <button onclick="comprar()">Comprar</button>
      <button onclick="toggleCarrito()" style="background-color: #6b7280; margin-top: 0.5rem;">Cerrar</button>
    </div>
  </div>

  <!-- Mensajes Flotantes -->
  <div id="mensaje-flotante" class="mensaje-flotante" style="display: none;"></div>

  <script src="app.js"></script>
</body>
</html>
